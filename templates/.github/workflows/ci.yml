# A minimal, real pipeline. Copy to .github/workflows/ci.yml and adjust the
# commands to match your project. Fast checks first — a typo should fail in
# thirty seconds, not four minutes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is now out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ordered by how fast they fail. Each one is a separate step so the
      # summary says which stage broke, without opening the log.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The docs graph is checked like anything else: frontmatter, links,
      # orphans, staleness. Documentation nothing verifies drifts silently, and
      # stale docs are worse than none — they are confidently wrong.
      - name: Docs graph
        run: node scripts/check-docs.mjs

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Slow and occasionally flaky — do not make every push wait for it.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e
        env:
          # A test project, never production. Set under
          # Settings → Secrets and variables → Actions.
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      # Traces make a failure in CI debuggable without reproducing it locally.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
